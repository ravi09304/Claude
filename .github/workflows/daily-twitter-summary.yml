name: Daily Twitter/X List Summary

on:
  schedule:
    # Runs at 8:00 AM UTC daily.
    # Adjust for your timezone — examples:
    #   8 AM IST  (UTC+5:30) → '30 2 * * *'
    #   8 AM EST  (UTC-5)    → '0 13 * * *'
    #   8 AM PST  (UTC-8)    → '0 16 * * *'
    - cron: '0 8 * * *'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  summarize:
    name: Fetch & Summarize Twitter List
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit summaries back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scheduler
        run: npm install

      - name: Run daily summary
        working-directory: scheduler
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scheduler.js --once

      - name: Commit summary to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scheduler/summaries/
          # Only commit if there's something new
          if git diff --staged --quiet; then
            echo "No new summary to commit."
          else
            git commit -m "chore: add daily summary $(date -u +%Y-%m-%d)"
            git push
          fi
